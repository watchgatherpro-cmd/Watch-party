<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Room | Watch Party</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/room.css">
</head>
<body class="room-body">
  <div class="room-container">
    
    <!-- شريط الأعضاء -->
    <div class="sidebar">
      <div class="header" style="display:flex; justify-content:space-between; align-items:center; width:100%;">
        <span>> MEMBERS</span>
        <div style="display:flex; gap:5px;">
          <button onclick="shareRoom()" style="padding:2px 6px; font-size:10px; background:transparent; color:var(--accent); border:1px solid var(--accent);">[ SHARE ]</button>
          <button onclick="toggleMembers()" style="padding:2px 6px; font-size:10px; background:transparent; color:var(--accent); border:1px solid var(--accent);">[ LIST ]</button>
        </div>
      </div>
      <ul id="member-list" class="member-list"></ul>
      <div class="room-info">
        <div>ROOM: <span id="room-name" class="highlight"></span></div>
        <div>CODE: <span id="room-code" class="highlight"></span></div>
      </div>
    </div>

    <!-- المنطقة الرئيسية -->
    <div class="main-area">
      <div class="video-section">
        <!-- مشغل يوتيوب المباشر -->
        <iframe id="player" src="about:blank" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
        
        <!-- أدوات التحكم -->
        <div id="controls" class="controls" style="display: none;">
          <input type="text" id="video-url" placeholder="YouTube URL...">
          <button onclick="loadVideo()">[ LOAD ]</button>
        </div>
      </div>

      <!-- الدردشة -->
      <div class="chat-section">
        <div id="chat-messages" class="chat-messages"></div>
        
        <div id="reply-bar" class="reply-bar" style="display: none;">
          <span id="reply-text"></span>
          <button onclick="cancelReply()">X</button>
        </div>

        <div class="chat-input-area">
          <input type="text" id="chat-input" placeholder="> type message..." onkeypress="handleEnter(event)">
          <button onclick="sendMessage()">[ SEND ]</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/room.js"></script>
</body>
</html>
